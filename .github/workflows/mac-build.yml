# Baut die Mac-App bei jedem Push (zum Testen). Das DMG liegt danach unter
# "Actions" -> Lauf -> "Artifacts". Veröffentlicht wird nur über release.yml.
name: Mac-Build

on:
  push:
    paths: ["mac-app/**", "pattern-studio/**", "firmware/**", ".github/workflows/*.yml"]
  pull_request:
  workflow_dispatch:

jobs:
  firmware:
    uses: ./.github/workflows/firmware.yml

  build:
    needs: firmware
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: receiver-firmware
          path: fw

      - name: Tests (Renderer)
        run: node --test pattern-studio/tests/*.test.js

      - name: App bauen
        env:
          FIRMWARE_UF2: ${{ github.workspace }}/fw/receiver/build/ledwall-receiver.uf2
          SENDER_UF2: ${{ github.workspace }}/fw/sender/build/ledwall-sender.uf2
          DIRECT_UF2: ${{ github.workspace }}/fw/sender/build/ledwall-direct.uf2
        run: ./mac-app/build.sh "$(tr -d ' \r\n' < VERSION)" "${{ github.repository }}"

      - uses: actions/upload-artifact@v4
        with:
          name: LED-Pattern-Studio
          path: mac-app/build/LED-Pattern-Studio.dmg
          retention-days: 14
