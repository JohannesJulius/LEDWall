# Baut die Firmware für Empfänger (RP2040 Zero) und Sender (Pico 2W). Wird von mac-build.yml
# und release.yml aufgerufen, damit die App die passenden .uf2 mitbringt.
name: Firmware

on:
  workflow_call:
  workflow_dispatch:

jobs:
  receiver:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Werkzeuge installieren
        # Erst über apt; sind die Ubuntu-Paketserver nicht erreichbar (kommt bei GitHub vor),
        # die ARM-Toolchain direkt von ARM laden. cmake und ninja sind auf dem Runner vorinstalliert.
        run: |
          if timeout 240 sh -c 'sudo apt-get update -qq && sudo apt-get install -y -qq gcc-arm-none-eabi libnewlib-arm-none-eabi cmake ninja-build'; then
            exit 0
          fi
          echo "apt nicht erreichbar – lade ARM GNU Toolchain"
          TC=arm-gnu-toolchain-13.3.rel1-x86_64-arm-none-eabi
          curl -fsSL --retry 3 -o "$RUNNER_TEMP/tc.tar.xz" "https://developer.arm.com/-/media/Files/downloads/gnu/13.3.rel1/binrel/$TC.tar.xz"
          tar -xf "$RUNNER_TEMP/tc.tar.xz" -C "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/$TC/bin" >> "$GITHUB_PATH"
          command -v ninja || pip install --quiet ninja
          cmake --version | head -1

      - name: Pico SDK holen
        run: |
          git clone -q --depth 1 -b 2.1.1 https://github.com/raspberrypi/pico-sdk.git "$RUNNER_TEMP/pico-sdk"
          git -C "$RUNNER_TEMP/pico-sdk" submodule update --init --depth 1 lib/tinyusb lib/cyw43-driver lib/lwip

      - name: Host-Tests
        run: |
          ./firmware/receiver/test/run.sh
          ./firmware/sender/test/run.sh

      - name: Empfänger bauen
        env:
          PICO_SDK_PATH: ${{ runner.temp }}/pico-sdk
        run: |
          cmake -S firmware/receiver -B firmware/receiver/build -G Ninja
          cmake --build firmware/receiver/build

      - name: Sender bauen
        env:
          PICO_SDK_PATH: ${{ runner.temp }}/pico-sdk
        run: |
          cmake -S firmware/sender -B firmware/sender/build -G Ninja
          cmake --build firmware/sender/build
          # Programm muss vor dem Bank-Bereich (1 MB) enden
          for ELF in ledwall-sender ledwall-direct; do
            SIZE=$(arm-none-eabi-size -A firmware/sender/build/$ELF.elf | awk '$1==".text"||$1==".rodata"||$1==".data"||$1==".binary_info"{s+=$2} END{print s}')
            echo "$ELF: $SIZE Byte"
            test "$SIZE" -lt 1000000
          done

      - uses: actions/upload-artifact@v4
        with:
          name: receiver-firmware
          path: |
            firmware/receiver/build/ledwall-receiver.uf2
            firmware/sender/build/ledwall-sender.uf2
            firmware/sender/build/ledwall-direct.uf2
          retention-days: 14
